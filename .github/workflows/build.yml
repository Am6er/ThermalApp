name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore ThermalApp.sln

      - name: Build
        run: dotnet build ThermalApp.sln -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/ThermalApp/ThermalApp.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=false
          -o publish/ThermalApp

      - name: Publish diagnostics tool
        run: >
          dotnet publish src/ThermalApp.Probe/ThermalApp.Probe.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/ThermalApp

      - name: Include libusb helper script
        run: Copy-Item tools/get-libusb.ps1 publish/ThermalApp/
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalApp-win-x64
          path: publish/ThermalApp

  release:
    # для тега vX.Y.Z собранная сборка прикладывается к релизу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ThermalApp-win-x64
          path: ThermalApp

      - name: Zip
        run: zip -r ThermalApp-${{ github.ref_name }}-win-x64.zip ThermalApp

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ThermalApp-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
