name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore ThermalApp.sln

      - name: Build
        run: dotnet build ThermalApp.sln -c Release --no-restore

      - name: Publish app
        run: >
          dotnet publish src/ThermalApp/ThermalApp.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/ThermalApp

      - name: Publish diagnostics tool
        run: >
          dotnet publish src/ThermalApp.Probe/ThermalApp.Probe.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/ThermalApp

      - name: Include libusb helper script
        run: Copy-Item tools/get-libusb.ps1 publish/ThermalApp/
        shell: pwsh

      - name: Package
        id: pack
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "latest"
          }
          $zip = "ThermalApp-$version-win-x64.zip"
          Compress-Archive -Path publish/ThermalApp/* -DestinationPath $zip -Force
          "zip=$zip"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermalApp-win-x64
          path: publish/ThermalApp

      # тег vX.Y.Z -> обычный релиз
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true

      # push в main -> перезаписываемый предрелиз со свежей сборкой
      - name: Release (rolling build from main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка из main
          prerelease: true
          make_latest: false
          files: ${{ steps.pack.outputs.zip }}
          body: |
            Автоматическая сборка из ветки `main`, коммит ${{ github.sha }}.

            Требуется [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0).
            Для vendor-команд камеры дополнительно нужны `libusb-1.0.dll`
            (`pwsh -File get-libusb.ps1`) и libusb-фильтр, установленный через Zadig —
            подробности в README.
